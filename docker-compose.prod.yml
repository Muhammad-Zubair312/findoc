# FinDoc Intelligence — Production Docker Compose (Azure VM)
# Usage:  docker-compose -f docker-compose.prod.yml up -d
# VM IP:  20.204.91.180

services:
  # ── Infrastructure ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: findoc
      POSTGRES_USER: findoc
      POSTGRES_PASSWORD: findoc_dev
    ports: ["5434:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U findoc"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6381:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports: ["6333:6333", "6334:6334"]
    volumes: ["qdrant_data:/qdrant/storage"]
    environment:
      QDRANT__SERVICE__GRPC_PORT: "6334"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (Production) ──────────────────────────────────────────────────────
  # ✅ target: prod  → source baked into image (COPY . .)
  # ✅ No --reload   → 2-3x faster response times
  # ✅ --workers 2   → handles concurrent requests
  # ✅ No source mount → runs from image, not live files
  # ✅ No hf_cache   → embedding model pre-downloaded in base stage
  backend:
    build:
      context: ./backend
      target: prod
    ports: ["8000:8000"]
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://findoc:findoc_dev@postgres:5432/findoc
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ""
      QDRANT_COLLECTION: findoc_sections
      USE_LOCAL_STORAGE: "true"
      LOCAL_UPLOAD_DIR: /app/uploads
      # Update CORS after Vercel deploy — add your real Vercel URL
      CORS_ORIGINS: '["http://20.204.91.180:3000","https://REPLACE_WITH_VERCEL_URL.vercel.app"]'
      ENV: prod
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
    volumes:
      - uploads_data:/app/uploads   # user uploaded files only
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2

  # ── Celery Worker (Production) ────────────────────────────────────────────────
  # ✅ Same prod image as backend (source baked in)
  # ✅ No source mount
  # ✅ No hf_cache (model already in image)
  celery:
    build:
      context: ./backend
      target: prod
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://findoc:findoc_dev@postgres:5432/findoc
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ""
      QDRANT_COLLECTION: findoc_sections
      USE_LOCAL_STORAGE: "true"
      LOCAL_UPLOAD_DIR: /app/uploads
      ENV: prod
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
    volumes:
      - uploads_data:/app/uploads
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2

  # ── Frontend (Production Build) ───────────────────────────────────────────────
  # ✅ target: prod  → npm run build + npm run start
  # ✅ NEXT_PUBLIC_* baked in at build time (required for Next.js)
  # ✅ No volume mounts → serves pre-built static bundle
  frontend:
    build:
      context: ./frontend
      target: prod
      args:
        NEXT_PUBLIC_API_URL: http://20.204.91.180:8000/api/v1
        NEXT_PUBLIC_WS_URL: ws://20.204.91.180:8000/api/v1
    ports: ["3000:3000"]
    restart: unless-stopped
    depends_on:
      backend: { condition: service_started }

volumes:
  postgres_data:
  qdrant_data:
  uploads_data:
  # hf_cache removed — embedding model is baked into the backend prod image