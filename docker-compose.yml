services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: findoc
      POSTGRES_USER: findoc
      POSTGRES_PASSWORD: findoc_dev
    ports: ["5434:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U findoc"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6381:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333", "6334:6334"]
    volumes: ["qdrant_data:/qdrant/storage"]
    environment:
      QDRANT__SERVICE__GRPC_PORT: "6334"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      target: dev
    ports: ["8000:8000"]
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://findoc:findoc_dev@postgres:5432/findoc
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ""
      QDRANT_COLLECTION: findoc_sections
      USE_LOCAL_STORAGE: "true"
      LOCAL_UPLOAD_DIR: /app/uploads
      CORS_ORIGINS: '["http://localhost:3000"]'
      ENV: dev
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
      - hf_cache:/root/.cache/huggingface
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery:
    build:
      context: ./backend
      target: dev
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://findoc:findoc_dev@postgres:5432/findoc
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ""
      QDRANT_COLLECTION: findoc_sections
      USE_LOCAL_STORAGE: "true"
      LOCAL_UPLOAD_DIR: /app/uploads
      ENV: dev
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
      - hf_cache:/root/.cache/huggingface
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2

  frontend:
    build:
      context: ./frontend
      target: dev
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/api/v1
    depends_on:
      backend: { condition: service_started }
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

volumes:
  postgres_data:
  qdrant_data:
  uploads_data:
  hf_cache:
